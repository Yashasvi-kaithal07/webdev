<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style="background-color: black; color: aliceblue;">
    
</body>

<script>

    const div = document.createElement('div')
    console.log(div);
    div.className = "main"
    div.id = Math.round(Math.random() * 10 + 1)//10 yaha range hai, Math.random()- 0.7567, Math.random() *10 - 0.7567 * 10  = 7.567
    div.setAttribute('title', "generated title")
    div.style.backgroundColor = "green"
    div.style.padding = "12px"
    // div.innerText = "Chai aur Code"  //ye override karta hai values ko
    const addText = document.createTextNode("Chai aur Code")
    div.appendChild(addText)
    document.body.appendChild(div)// attaching file
    
</script>

</html>
